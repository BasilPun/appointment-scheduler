<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Scheduler</title>
     <link rel = "stylesheet" href = "../styles/home-style.css">
    <script src = "../scripts/home-script.js" defer></script>
</head>
<body>
    <main>
        <h1 id = "appt-header">Appointment Scheduler</h1>
        <form id = "appt-form" action = "/submit-appt" method= "post">
            <h2>Book an Appointment</h2>

            <div id = "fname-box">
                <label for = "fname">First Name</label>
                <input type = "text" id = "fname" name = "fname">
                <span class = "err" id = "err-fname">First name is required</span>
            </div>

            <div id = "lname-box">
                <label for = "lname">Last Name</label>
                <input type = "text" id = "lname" name = "lname">
                <span class = "err" id = "err-lname">Last name is required</span>
            </div>

            <div id = "meeting-date-box">
                <label for = "meeting-date">Meeting Date</label>
                <input type = "date" id = "meeting-date" name = "meeting-date">
            </div>

            <div id = "meeting-time-box">
                <label for = "meeting-time">Meeting Time</label>
                <input type = "time" id = "meeting-time" name = "meeting-time">
            </div>

            <button type = "submit" id = "submit">Place order</button>
        </form>
    </main>
</body>
</html>
